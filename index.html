<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Air 200 EFB</title>
    <link rel="stylesheet" href="style.css">
    <!-- HyperFormula laddas via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hyperformula@latest/dist/hyperformula.full.min.js"></script>
</head>
<body>
    <header>
        <h1>BE20 EFB - Performance</h1>
        <div class="global-reg">
            <label for="global-registration">Reg:</label>
            <input type="text" id="global-registration" value="SE-XXX" />
        </div>
    </header>

    <!-- Fliknavigering -->
    <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('takeoff')">Take-off</button>
        <button class="tab-btn" onclick="switchTab('landing')">Landing</button>
    </nav>

    <main>
        <!-- TAKEOFF-FLIK -->
        <section id="page-takeoff" class="tab-content active">
            <h2>Startprestanda</h2>
            
            <div class="form-group">
                <label>Flygplats & Bana (C4):</label>
                <select id="to-airport" onchange="handleTakeoffAirport(this.value)">
                    <option value="">Laddar flygplatser...</option>
                </select>
            </div>

            <fieldset>
                <legend>Väder & Overrides</legend>
                <div class="grid-2">
                    <div><label>Vindriktning (C6 / E6 ovr):</label><input type="number" id="to-wind-dir" placeholder="Auto (C6)" oninput="handleWeather('takeoff', 'windDir', this.value)"></div>
                    <div><label>Override E6:</label><input type="number" id="to-wind-dir-ovr" placeholder="Ovr E6" oninput="handleWeatherOverride('takeoff', 'windDirOverride', this.value)"></div>
                    <div><label>Vindstyrka (C7 / E7 ovr):</label><input type="number" id="to-wind-spd" placeholder="Auto (C7)" oninput="handleWeather('takeoff', 'windSpeed', this.value)"></div>
                    <div><label>Override E7:</label><input type="number" id="to-wind-spd-ovr" placeholder="Ovr E7" oninput="handleWeatherOverride('takeoff', 'windSpeedOverride', this.value)"></div>
                    <div><label>OAT °C (C8 / E8 ovr):</label><input type="number" id="to-oat" placeholder="Auto (C8)" oninput="handleWeather('takeoff', 'oat', this.value)"></div>
                    <div><label>Override E8:</label><input type="number" id="to-oat-ovr" placeholder="Ovr E8" oninput="handleWeatherOverride('takeoff', 'oatOverride', this.value)"></div>
                    <div><label>QNH (C9 / E9 ovr):</label><input type="number" id="to-qnh" placeholder="Auto (C9)" oninput="handleWeather('takeoff', 'qnh', this.value)"></div>
                    <div><label>Override E9:</label><input type="number" id="to-qnh-ovr" placeholder="Ovr E9" oninput="handleWeatherOverride('takeoff', 'qnhOverride', this.value)"></div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Setup & Mass</legend>
                <div class="form-group">
                    <label>Startmassa (C14: <span id="to-mass-val">10000</span> lbs) [8000–12500]:</label>
                    <input type="range" id="to-mass" min="8000" max="12500" step="50" value="10000" oninput="handleTakeoffMass(this.value)">
                </div>
                <div class="form-group">
                    <label>Flaps (Dropdown PWA):</label>
                    <select id="to-flaps" onchange="handleTakeoffFlaps(this.value)">
                        <option value="UP">UP</option>
                        <option value="APP">APP</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Banförorening / Contaminant (C11):</label>
                    <input type="text" id="to-contaminant" value="Dry" oninput="updateEngineCellVal('takeoff', 'contaminant', this.value)">
                </div>
                <div class="form-group">
                    <label>Engine Anti-Ice (C13):</label>
                    <select id="to-anti-ice" onchange="updateEngineCellVal('takeoff', 'antiIce', this.value)">
                        <option value="OFF">OFF</option>
                        <option value="ON">ON</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>RWCC (C10):</label>
                    <input type="number" id="to-rwcc" value="6" min="1" max="6" oninput="updateEngineCellVal('takeoff', 'rwcc', this.value)">
                </div>
            </fieldset>

            <div class="results-box">
                <h3>Beräknat Resultat</h3>
                <p>V1: <strong id="res-to-v1">-</strong></p>
                <p>VR: <strong id="res-to-vr">-</strong></p>
                <p>V2: <strong id="res-to-v2">-</strong></p>
                <p>TOD: <strong id="res-to-tod">-</strong> m</p>
            </div>
        </section>

        <!-- LANDING-FLIK -->
        <section id="page-landing" class="tab-content">
            <h2>Landningsprestanda</h2>
            
            <div class="form-group">
                <label>Flygplats & Bana (C4):</label>
                <select id="ldg-airport" onchange="handleLandingAirport(this.value)">
                    <option value="">Laddar flygplatser...</option>
                </select>
            </div>

            <fieldset>
                <legend>Väder & Overrides</legend>
                <div class="grid-2">
                    <div><label>Vindriktning (C6 / E6 ovr):</label><input type="number" id="ldg-wind-dir" oninput="handleWeather('landing', 'windDir', this.value)"></div>
                    <div><label>Override E6:</label><input type="number" id="ldg-wind-dir-ovr" oninput="handleWeatherOverride('landing', 'windDirOverride', this.value)"></div>
                    <div><label>Vindstyrka (C7 / E7 ovr):</label><input type="number" id="ldg-wind-spd" oninput="handleWeather('landing', 'windSpeed', this.value)"></div>
                    <div><label>Override E7:</label><input type="number" id="ldg-wind-spd-ovr" oninput="handleWeatherOverride('landing', 'windSpeedOverride', this.value)"></div>
                    <div><label>OAT °C (C8 / E8 ovr):</label><input type="number" id="ldg-oat" oninput="handleWeather('landing', 'oat', this.value)"></div>
                    <div><label>Override E8:</label><input type="number" id="ldg-oat-ovr" oninput="handleWeatherOverride('landing', 'oatOverride', this.value)"></div>
                    <div><label>QNH (C9 / E9 ovr):</label><input type="number" id="ldg-qnh" oninput="handleWeather('landing', 'qnh', this.value)"></div>
                    <div><label>Override E9:</label><input type="number" id="ldg-qnh-ovr" oninput="handleWeatherOverride('landing', 'qnhOverride', this.value)"></div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Setup & Mass</legend>
                <div class="form-group">
                    <label>Landningsmassa (C11: <span id="ldg-mass-val">9500</span> lbs) [9000–12500]:</label>
                    <input type="range" id="ldg-mass" min="9000" max="12500" step="50" value="9500" oninput="handleLandingMass(this.value)">
                </div>
                <div class="form-group">
                    <label>Flaps (Dropdown PWA):</label>
                    <select id="ldg-flaps" onchange="handleLandingFlaps(this.value)">
                        <option value="UP">UP</option>
                        <option value="DOWN">DOWN</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>RWCC (C10):</label>
                    <input type="number" id="ldg-rwcc" value="6" min="1" max="6" oninput="updateEngineCellVal('landing', 'rwcc', this.value)">
                </div>
            </fieldset>

            <div class="results-box">
                <h3>Beräknat Resultat</h3>
                <p>VREF: <strong id="res-ldg-vref">-</strong></p>
                <p>Landningsdistans: <strong id="res-ldg-dist">-</strong> m</p>
            </div>
        </section>
    </main>

<script src="js/app.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</body>
</html>
